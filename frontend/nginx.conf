server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check
    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API calls → backend
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus metrics → backend
    location = /metrics {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
    }

    # Static assets
    location ~* \.(css|js|ico|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Frontend pages
    location /pages/ {
        try_files $uri $uri.html =404;
    }

    # Short-code redirects → backend
    # Only match if NOT a known static path
    location ~ "^/([A-Za-z0-9]{4,16})$" {
        # Exclude known frontend words
        if ($uri ~* "^/(index|login|register|dashboard|health|metrics|pages|css|js)$") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → SPA
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
